# ---------------------------------------------------------------
# News digest config — edit freely, no code changes needed.
#   feeds:    plain RSS/Atom URLs
#   queries:  Google News searches (great for niche topics)
#   focus:    tells the AI what "important" means for this section
# ---------------------------------------------------------------

timezone: America/Edmonton
region: CA                 # Google News edition (CA, US, GB, IN...)
lookback_hours: 13         # covers the gap between the two daily runs
top_n: 5                   # stories per section in the email
reel_top_n: 6              # stories per channel in the swipe site
max_candidates: 40         # stories sent to the AI per section for ranking

ai:                        # Google AI Studio (Gemini). Key: GEMINI_API_KEY
  enabled: true            # without a key you still get headlines, newest first
  model: gemini-3.5-flash-lite
  fallback_models: [gemini-3.1-flash-lite, gemini-3.6-flash]   # tried if the first is unavailable
  min_interval: 5          # seconds between calls, keeps you inside the free-tier rate limit

categories:
  - name: Tech
    emoji: "💻"
    color: "#2D5BFF"
    ink: light
    reel_top_n: 8              # this channel gets more cards than the others
    focus: >-
      For a working software developer who follows AI closely. Favour: new open-source repos and tools worth trying,
      AI coding agents and vibe coding (Claude Code, Cursor, Copilot, MCP servers, agent skills), framework and language
      releases, developer tooling, practical engineering write-ups and security incidents that affect developers.
      Skip general gadget and consumer-tech news.
    finds:                     # "findings": things to try, not just news
      github_topics: [llm, ai-agents, mcp, claude-code, vibe-coding, developer-tools]
      github_days: 7           # only repos created in the last N days
      github_min_stars: 100    # that already have this many stars
      show_hn: true            # Show HN projects from the last 2 days
      show_hn_min_points: 40
      max: 20
    feeds:
      - https://simonwillison.net/atom/everything/
      - https://github.blog/feed/
      - https://huggingface.co/blog/feed.xml
      - https://www.latent.space/feed
      - https://lobste.rs/rss
      - https://feeds.arstechnica.com/arstechnica/index
      - https://hnrss.org/frontpage?points=200
    queries:
      - "vibe coding"
      - "AI coding agent OR \"Claude Code\" OR Cursor OR Copilot"
      - "open source developer tool release"

  - name: AI & Cloud
    emoji: "🤖"
    color: "#7B3FF2"
    ink: light
    focus: New AI models and research, AWS/Azure/GCP launches and outages, AI regulation, developer-relevant cloud changes.
    feeds:
      - https://aws.amazon.com/blogs/aws/feed/
      - https://cloudblog.withgoogle.com/rss/
    queries:
      - "artificial intelligence model release"
      - "AWS OR Azure OR \"Google Cloud\" announces"

  - name: Tech Job Market
    emoji: "💼"
    color: "#0F7A57"
    ink: light
    focus: Layoffs, hiring trends, in-demand skills, Canadian tech hiring, junior developer market.
    queries:
      - "tech layoffs OR tech hiring"
      - "software developer jobs Canada"
      - "Calgary tech jobs"

  - name: Canada & Alberta
    emoji: "🍁"
    color: "#D42A24"
    ink: light
    focus: Alberta and Calgary news, federal policy, Canadian tech and startup news.
    feeds:
      - https://betakit.com/feed/
    queries:
      - "Calgary"
      - "Alberta government"
      - "Canada federal government"

  - name: Business & Markets
    emoji: "📈"
    color: "#FFC21A"
    ink: dark
    focus: Market-moving news, interest rates (Bank of Canada, Fed), earnings of major tech companies, oil and energy.
    feeds:
      - https://www.cnbc.com/id/100003114/device/rss/rss.html
    queries:
      - "Bank of Canada interest rate"
      - "stock market today"

  - name: Games
    emoji: "🎮"
    color: "#D6246E"
    ink: light
    focus: Major game releases and reveals, studio acquisitions and layoffs, console/platform news, big industry deals.
    feeds:
      - https://www.gamesindustry.biz/feed
      - https://www.polygon.com/rss/index.xml
    queries:
      - "video game industry"

  - name: Movies
    emoji: "🎬"
    color: "#FF6A1A"
    ink: dark
    focus: Marvel, DC and other big franchise news — casting, trailers, release dates, box office, studio decisions.
    feeds:
      - https://deadline.com/feed/
      - https://variety.com/feed/
    queries:
      - "Marvel Studios"
      - "DC Studios"
      - "box office weekend"

# ---------------------------------------------------------------
# Trending tab (python news_bot.py --trending)
#   desi = Indian side, world = everything else. desi_share is the Indian fraction of the tab.
# ---------------------------------------------------------------
trending:
  counts: {topic: 14, meme: 14, video: 8}     # cards per kind; total about 36
  desi_share: 0.5                              # 0.5 = half Indian, half worldwide
  reddit:
    desi: [IndianDankMemes, indiameme, IndianMeyMeys, IndianPeopleTwitter, CricketShitpost, bollywoodmemes]
    world: [memes, dankmemes, me_irl, funny]
    per_sub: 25                                # posts looked at per subreddit
    max_per_sub: 4                             # so one sub can't take over
  google_trends:
    desi: [IN]
    world: [US, GB, CA]
  news_queries:                                # Google News searches that add context for topics
    desi: ["Bollywood", "IPL OR cricket India", "viral video India", "Punjabi singer", "web series OTT India", "trending India"]
    world: ["viral on social media", "celebrity news", "trending challenge", "internet reacts"]
  youtube:                                     # needs YOUTUBE_API_KEY (see README)
    desi: [IN]
    world: [US, GB]
  wikipedia: true
  bluesky_fallback: true                       # fills worldwide memes if Reddit blocks the server
